name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Local only: generates the Prisma client types, never touches a database.
      - run: npx prisma generate
      # Route types (RouteContext) that a dev server or build would normally emit.
      - run: npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      # Unit, integration and offline eval tests. Auth, Prisma and the
      # Anthropic models are mocked, so no secrets are needed here. The paid
      # eval (npm run eval:tailor) stays a manual step.
      - run: npm test
